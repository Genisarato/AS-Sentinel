server:
  port: 8080

spring:
  application:
    name: as-sentinel-core
  datasource:
    url: jdbc:postgresql://localhost:5432/assentinel
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

as-sentinel:
  ai:
    base-url: http://localhost:8000