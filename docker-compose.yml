services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: as-sentinel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: as-sentinel-postgres
    environment:
      POSTGRES_DB: assentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./as-sentinel-ai
    container_name: as-sentinel-ai
    ports:
      - "8000:8000"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  core:
    build:
      context: ./as-sentinel-core
    container_name: as-sentinel-core
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assentinel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      AS_SENTINEL_AI_BASE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data: