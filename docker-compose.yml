version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: as-sentinel-db
    environment:
      POSTGRES_DB: assentinel
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: as-sentinel-qdrant
    ports:
      - "6333:6333" # API REST / Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: